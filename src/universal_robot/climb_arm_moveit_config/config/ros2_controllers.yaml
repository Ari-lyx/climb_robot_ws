controller_manager:
  ros__parameters:
    update_rate: 1000
    use_sim_time: true
    arm_joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
arm_joint_state_broadcaster:
  ros__parameters:
    joints:
    - arm_shoulder_pan_joint
    - arm_shoulder_lift_joint
    - arm_elbow_joint
    - arm_wrist_1_joint
    - arm_wrist_2_joint
    - arm_wrist_3_joint
    interfaces:
    - position
    - velocity
    - effort
    use_local_topics: true
arm_controller:
  ros__parameters:
    joints:
    - arm_shoulder_pan_joint
    - arm_shoulder_lift_joint
    - arm_elbow_joint
    - arm_wrist_1_joint
    - arm_wrist_2_joint
    - arm_wrist_3_joint
    command_interfaces:
    - effort
    state_interfaces:
    - position
    - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      goal_time: 5.0
      stopped_velocity_tolerance: 0.08
      arm_shoulder_pan_joint:
        trajectory: 0.3
        goal: 0.03
      arm_shoulder_lift_joint:
        trajectory: 0.3
        goal: 0.03
      arm_elbow_joint:
        trajectory: 0.3
        goal: 0.03
      arm_wrist_1_joint:
        trajectory: 0.3
        goal: 0.03
      arm_wrist_2_joint:
        trajectory: 0.3
        goal: 0.03
      arm_wrist_3_joint:
        trajectory: 0.3
        goal: 0.03
    gains:
      arm_shoulder_pan_joint:
        p: 150.0
        i: 20.0
        d: 1.0
        i_clamp: 20.0
        ff_velocity_scale: 0.0
      arm_shoulder_lift_joint:
        p: 150.0
        i: 30.0
        d: 0.8
        i_clamp: 20.0
        ff_velocity_scale: 0.0
      arm_elbow_joint:
        p: 70.0
        i: 20.0
        d: 0.3
        i_clamp: 20.0
        ff_velocity_scale: 0.0
      arm_wrist_1_joint:
        p: 15.0
        i: 8.0
        d: 0.05
        i_clamp: 20.0
        ff_velocity_scale: 0.0
      arm_wrist_2_joint:
        p: 10.0
        i: 4.0
        d: 0.03
        i_clamp: 20.0
        ff_velocity_scale: 0.0
      arm_wrist_3_joint:
        p: 4.0
        i: 1.0
        d: 0.008
        i_clamp: 20.0
        ff_velocity_scale: 0.0
    allow_nonzero_velocity_at_trajectory_end: false
